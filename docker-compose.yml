name: autodetail

services:
  postgres:
    image: postgres:16-alpine
    container_name: autodetail-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: autodetail
      POSTGRES_PASSWORD: autodetail
      POSTGRES_DB: autodetail
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autodetail -d autodetail"]
      interval: 5s
      timeout: 5s
      retries: 10

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile.seed
    container_name: autodetail-seed
    environment:
      DATABASE_URL: postgresql://autodetail:autodetail@postgres:5432/autodetail?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autodetail-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://autodetail:autodetail@postgres:5432/autodetail?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: 7d
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_BASE: http://localhost:3001/api
    container_name: autodetail-frontend
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:3001/api
      NUXT_API_BASE: http://backend:3001/api
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
